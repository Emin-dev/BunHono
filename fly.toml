# fly.toml app configuration file generated for bun-hono-todo-htmx
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "bun-hono-todo-htmx-dev" # Replace with your actual app name on Fly.io
primary_region = "iad" # Example region, choose one close to your users

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080" # Fly.io sets this, and our app uses it.

[[http_service]]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true # Can be true/false or "off"
  auto_start_machines = true # Can be true/false
  min_machines_running = 0 # For free tier, usually 0 for non-critical apps
  processes = ["app"] # Corresponds to the process group in Dockerfile CMD (implicit "app" group)

  [[http_service.ports]]
    handlers = ["http"]
    port = 80

  [[http_service.ports]]
    handlers = ["tls", "http"]
    port = 443

  [http_service.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

# Optional: Mount a volume for persistent SQLite storage
# This is a common setup for SQLite on Fly.io to persist data across deploys/restarts.
# If you uncomment this, you'll need to `fly volumes create <volume_name> --region <region> --size <size_gb>`
# And ensure your application writes the sqlite db to /data/todos.sqlite
# [mounts]
#  source="myapp_data" # Name of the volume
#  destination="/data" # Mount path in the container
#  initial_size = "1gb"

