<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37i7dUxdscwKGmMmksO" crossorigin="anonymous"></script>
    <script src="/public/app.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Todo List</h1>
        <div id="error-message-container" role="alert"></div>

        <!-- Section to display todos -->
        <section id="todo-list" hx-get="/todos" hx-trigger="load" hx-swap="innerHTML">
            <!-- Todos will be loaded here by HTMX -->
            <p>Loading todos...</p>
        </section>

        <hr>

        <!-- Form to add new todos -->
        <section>
            <h2>Add New Todo</h2>
            <form id="add-todo-form" hx-post="/todos" hx-target="#todo-list" hx-swap="beforeend">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" maxlength="200" required>

                <label for="description">Description</label>
                <textarea id="description" name="description" maxlength="4000"></textarea>

                <button type="submit">Add Todo</button>
            </form>
        </section>
    </main>
</body>
</html>
